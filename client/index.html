    <!-- Link previews (WhatsApp, Facebook, X, etc.) -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Splash shown before the app's JavaScript has loaded; React replaces it on mount. */
      .splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #FAF8F5; font-family: Inter, system-ui, sans-serif; color: rgba(23,23,23,.65); text-align: center; padding: 0 24px; }
      .splash-spin { width: 40px; height: 40px; border-radius: 50%; border: 4px solid #E6F2EA; border-top-color: #0B6B2E; animation: splash-rot .8s linear infinite; }
      .splash b { font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 800; font-size: 20px; color: #171717; }
      .splash small { opacity: 0; animation: splash-in .4s ease 6s forwards; }
      @keyframes splash-rot { to { transform: rotate(360deg); } }
      @keyframes splash-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .splash-spin { animation-duration: 2s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-live="polite">
        <div class="splash-spin" aria-hidden="true"></div>
        <b>De-Boyz Foods</b>
        <span>Loading, one moment...</span>
        <small>Taking a little longer than usual. Hang tight...</small>
        <noscript>Please enable JavaScript to use this site.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
